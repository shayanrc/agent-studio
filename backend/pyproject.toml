[project]
name = "agent-studio"
version = "0.1.0"
description = "Agent Studio backend — agentic coding + branching chat + spec/plan/task workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "langchain>=0.3",
  "langgraph>=0.2.60",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
  "langchain-google-genai>=2.0",
  "langchain-mistralai>=0.2",
  "langchain-groq>=0.2",
  "langchain-cohere>=0.3",
  "langchain-xai>=0.1",
  "langchain-deepseek>=0.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
